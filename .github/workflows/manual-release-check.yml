name: Manual strict release check

on:
  workflow_dispatch:

jobs:
  strict-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit release scope (strict)
        run: python scripts/audit_release_scope.py --strict
      - name: Audit release notebooks (strict)
        run: python scripts/audit_notebooks.py --require
      - name: Verify manuscript-facing core claims
        run: python scripts/verify_core_claims.py
      - name: Verify prepared transfer assets (strict)
        run: python scripts/verify_pending_transfer.py --require-all
      - name: Verify release-safe E2-A internal predictions (strict)
        run: python scripts/verify_internal_predictions.py --strict
      - name: Confirm no unresolved release markers
        run: |
          if grep -R -n -E 'COMPLETAR ANTES DEL ENV[IÍ]O|\[Añadir DOI|TODO_RELEASE|RECONCILIATION_REQUIRED' --exclude-dir=.git . ; then
            echo 'Unresolved release marker found.'
            exit 1
          fi
