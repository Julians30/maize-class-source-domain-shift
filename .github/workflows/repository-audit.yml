name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repository scripts
        run: python -m compileall -q scripts -x 'scripts/analysis/provenance_fragments/.*'
      - name: Verify canonical manuscript analysis code
        run: python scripts/verify_canonical_analysis_code.py
      - name: Verify provenance analysis code
        run: python scripts/verify_provenance_analysis_code.py
      - name: Audit release scope
        run: python scripts/audit_release_scope.py
      - name: Audit release notebooks
        run: python scripts/audit_notebooks.py --require
      - name: Verify manuscript-facing core claims
        run: python scripts/verify_core_claims.py
      - name: Verify exact internal blocked macro-F1 randomization
        run: python scripts/verify_internal_blocked_exact.py
      - name: Verify architecture ranking stability and selection loss
        run: python scripts/verify_ranking_stability.py
      - name: Verify supplementary S5-S6 reconciliation
        run: python scripts/verify_supplementary_reconciliation.py
      - name: Verify any pending-transfer assets already present
        run: python scripts/verify_pending_transfer.py
      - name: Verify release-safe E2-A internal predictions when present
        run: python scripts/verify_internal_predictions.py
      - name: Verify release-safe Pandian2019 predictions when present
        run: python scripts/verify_pandian_predictions.py
      - name: Verify release-safe PlantVillage assets when present
        run: python scripts/verify_plantvillage_release.py
      - name: Verify release-safe TOM2024 assets when present
        run: python scripts/verify_tom2024_release.py
      - name: Verify pre-submission external artifact registry
        run: python scripts/verify_external_artifact_registry.py --presubmission
      - name: Verify canonical release manifest when present
        shell: bash
        run: |
          if [[ -f manifests/release_sha256.csv ]]; then
            python scripts/verify_release_manifest.py
          else
            echo "release_sha256.csv not frozen yet; skipping canonical manifest verification."
          fi
