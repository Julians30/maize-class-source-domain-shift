name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit release scope
        run: python scripts/audit_release_scope.py
      - name: Audit release notebooks when present
        run: python scripts/audit_notebooks.py
      - name: Verify manuscript-facing core claims
        run: python scripts/verify_core_claims.py
      - name: Verify exact internal blocked macro-F1 randomization
        run: python scripts/verify_internal_blocked_exact.py
      - name: Verify any pending-transfer assets already present
        run: python scripts/verify_pending_transfer.py
      - name: Verify release-safe E2-A internal predictions when present
        run: python scripts/verify_internal_predictions.py
      - name: Verify release-safe Pandian2019 predictions when present
        run: python scripts/verify_pandian_predictions.py
      - name: Verify release-safe PlantVillage assets when present
        run: python scripts/verify_plantvillage_release.py
      - name: Verify release-safe TOM2024 assets when present
        run: python scripts/verify_tom2024_release.py
